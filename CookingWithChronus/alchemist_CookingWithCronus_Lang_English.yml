  ALCH_CHEF_TDONE_INTRO_DESC: >-
    <HIGHLIGHT>Iteration Cronus<> has expanded their offerings for Travelers
    visiting the Nexus! Fair  compensation and competitive prices for all your
    cuisine preparation needs.
  ALCH_CHEF_TDONE_INTRO_P1: >-
    Cronus is now willing to pay a premium for some of their <SPECIAL>favorite
    dishes<>  but what they are in the mood for changes daily.
  ALCH_CHEF_TDONE_INTRO_P2: >-
    Through the <TRADE>Ingredients Market<>, Cronus allows Travelers to sell
    their  excess farm and harvest products. Ingredient selection changes daily.
  ALCH_CHEF_TDONE_INTRO_P3: >-
    Cronus has been tracking migratory fleets of <SPECIAL>cosmic megafauna<>.
    Speak with them about whalesong once the <TECHNOLOGY>Dream Aerial<> mission
    has been completed.
  ALCH_CHEF_WHALE_MP_ERR_OSD: >-
    OFFERING OF A FORGOTTEN SONG <HIGHLIGHT>//<> <FUEL>ERROR ~ NEXUS MISSION
    INTERFERENCE<>
  ALCH_CHEF_WHALE_NEARBY_MSG1: |-
    <SPECIAL>Offering of a Forgotten Song<> <TITLE>seeking harmonic partner<>
    The song is eminating... %SIGNAL%
  ALCH_CHEF_WHALE_NEARBY_MSG2: |-
    <SPECIAL>Offering of a Forgotten Song<> <TITLE>seeking harmonic partner<>
    Return to your ship to broadcast the request
  ALCH_CHEF_WHALE_NEARBY_MSG3: |-
    <SPECIAL>Offering of a Forgotten Song<> <TITLE>seeking harmonic partner<>
    Activate the <TECHNOLOGY>Pulse Drive<> to broadcast the request
  ALCH_CHEF_WHALE_NEARBY_MSG4: |-
    <FUEL>Song Silenced<> ~ <TITLE>Discordant tonal interference detected<>
    Answer the <STELLAR>Communicator<> to resolve conflicting signals
  ALCH_CHEF_WHALE_PROMPT: >-
    I accept, Traveler. I want to see you more clearly. Share with me the song
    of our future...
  ALCH_CHEF_WHALE_SHIP_RES: >-
    A gift of companionship granted. Perhaps we will meet again Traveler, in a
    different song.
  ALCH_CHEF_WHALE_START_OSD: OFFERING OF A FORGOTTEN SONG <HIGHLIGHT>//<> <TRADE>HARMONIZING<>
  ALCH_CHEF_WHALE_TECH_RES: >-
    A gift of knowledge granted. It has been worth the wait to meet you,
    Traveller. This will recur, when you are ready.
  ALCH_CHEF_WHALE_TITLE: Harmonizing with Forgotten Song
  CHEF_MENU_00_BRIBE_CANCEL_RES: >-
    Nothing of interest, that's alright. Just don't go telling Polo about my
    offer, okay?
  CHEF_MENU_00_BRIBE_DONE_RES: Good choice! Give me a moment to make it official.
  CHEF_MENU_00_BRIBE_INTRO_BF_RES: >-
    Traveler, have you sensed the disturbances in the cosmic currents? These
    <SPECIAL>BOUNDARY FAILURES<> threaten to unravel its delicate balance.

    My esteemed suppliers are facing unprecedented challenges. Their carefully
    orchestrated movements are disrupted by spatial and temporal distortions.

    In times of such uncertainty, resourcefulness is paramount. I propose a
    mutually advantageous arrangement...
  CHEF_MENU_00_BRIBE_INTRO_RES: >-
    What's that Traveler, is the Ingredient Market not in your favor today?
    Lucky for you, we are friends! I will do you a favor.

    What you can buy today is locked in because of market forces and previous
    arrangements, but...
  CHEF_MENU_00_BRIBE_LANG: >-
    For a small processing fee, I will let you choose what you can sell at the
    market today.
  CHEF_MENU_00_BRIBE_LANG_EVT: >-
    For a nominal processing fee, a <FLORA>75%<> discount of my usual rate, I
    will let you choose what you can sell at the market today.
  CHEF_MENU_00_DAILY_CHANGE: |-
    <TITLE>The Daily Favorite and Ingredient Market have changed<>
    Visit Cronus to learn today's specials
  CHEF_MENU_00_DS_A0_DESC: >-
    Today I will pay 210 nanites per unit of The Stellarator. A doughnut made of
    starlight, sublime!
  CHEF_MENU_00_DS_A0_DESC_S: >-
    Today I will pay 242 nanites per unit of The Stellarator. A doughnut made of
