    The Offering's chorus is reaching out to the depths of space for a harmonic
    partner.


    Activate your Pulse Drive in deep space to extend the offerings broadcast
    range.
  UI_P_CHEF_SONG_X_NAME: OFFERING OF A FORGOTTEN SONG (BROADCASTING)
  UI_P_CHEF_SONG_X_NAME_L: Offering of a Forgotten Song (Broadcasting)
