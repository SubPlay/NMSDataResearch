  D_ALCF_BUY_LANG: >-
    Each shipment contains <SPECIAL>50<> of the purchased item. Limited to
    <SPECIAL>5<> shipments of each category per day.
  D_ALCF_HOME_LANG: >-
    Good day to you, Traveler. Interested in today's <SPECIAL>Events &
    Specials<>, or would you like to trade on the <TRADE>Ingredients Market<>?
  D_ALCF_HOME_OPT_A: Events & Specials...
  D_ALCF_IM_LANG: 'Are you looking to buy, sell, or donate?'
  D_ALCF_IM_OPT_A: Buy...
  D_ALCF_IM_OPT_B: Sell...
  D_ALCF_IM_OPT_C: Donate...
  D_ALCF_IM2_LANG: Or perhaps you are interested in discussing the current market conditions?
  D_ALCF_P2_ALT_RES_B: >-
    Persistent, very well. The <SPECIAL>alchemist<> gave me this recipe, said I
    would know the right time to pass it along.

    A word of warning, however. Only Travelers with a <TECHNOLOGY>FREIGHTER<>
    will be able to unlock it's true potential.
  D_ALCF_PAGE2_OPT_C: Replace lost offering
  D_ALCF_PAGE2_OPT_D: Forgotten Songs...
  D_ALCF_PAGE2_OPT_E: Manage Preferences...
  D_ALCF_SELL_LANG: >-
    When selling your goods, I will pay average market per-shipment price of
    <SPECIAL>300<> for creature byproducts, <SPECIAL>200<> for meat, and
    <SPECIAL>100<> for plants.
  D_ALCF_WS_BUY_LANG: >-
    The universe has many more secrets to uncover. Shall we attune to the song
    in it's memories once more?
  D_ALCF_WS_BUY_OPT_A: Create an Offering
  D_ALCF_WS_BUY_OPT_B: Acquire Recipe
  D_ALCF_WS_BUY_RES_A: >-
    You tell Cronus a story from your travels among the sea of stars. Before
    long, a familiar chorus drifts through the market stall.
  D_ALCF_WS_BUY_RES_B: >-
    I will miss the stories, but I cannot stand in the way of your discovery.
    Here you are my friend, please help the universe remember.
  D_ALCF_WS_PREF_LANG: 'How can I best tailor my services to your needs, Traveler?'
  D_ALCF_WS_PREF_OPT_A: Subscribe to daily menu notifications
  D_ALCF_WS_PREF_OPT_B: Unsubscribe from daily menu notifications
  D_ALCF_WS_PREF_RES_A: >-
    Fantastic! I will be sure to keep you informed of the day's events and
    specials.
  D_ALCF_WS_PREF_RES_B: Very well. I will no longer bother you with the day's events and specials.
  D_ALCF_WS_TUT1_FLOW_DESC_1: Cronus searches for a sign of recognition in your expression.
  D_ALCF_WS_TUT1_FLOW_LANG_0: >-
    What a fascinating topic! Yes, it appears that cosmic megafauna are now
    migrating through the galaxy.

    These are just rumors though, or perhaps you have seen them?
  D_ALCF_WS_TUT1_FLOW_LANG_2: >-
    You HAVE seen them! What fortuitus circumstances we find ourselves in.

    I theorize that within the wake of these cosmic beings are memories, lost
    even to them.

    If we could attune to these memories, it would capture the attention of a
    nearby migratory fleet.
  D_ALCF_WS_TUT1_OPT_A: 'Please, continue...'
  D_ALCF_WS_TUT2_FLOW_DESC_0: 'Reassured they have your full attention, they continue.'
  D_ALCF_WS_TUT2_FLOW_DESC_2: >-
    Cronus stops in full crescendo and looks in the direction of the other Nexus
    denizens.

    Statisfied no others caught this moment of untethered excitement, Cronus
    continues in a whisper.
  D_ALCF_WS_TUT2_FLOW_LANG_1: >-
    Now, a scientist would have you construct all sorts of instrumentation and
    devices. Discordant and cold things that would only alienate, not invite.

    These are living creatures and if we wish to make new friends, that is
    always best done over the finest of foods.

    I will prepare a dessert! One of such magnificence that it will sing of all
    that the stars have seen.
  D_ALCF_WS_TUT2_FLOW_LANG_3: >-
    And you, Traveler, will carry it beyond the Nexus to whomever comes seeking
    it's call.

    But you must promise to return and tell me what secrets this galaxy has
    forgotten.
  D_ALCF_WS_TUT2_OPT_A: Agree to this task...
  D_ALCF_WS_TUT2_RES_A: 'Wonderous! Simply wonderous! Now, if only I could remember where I put...'
  D_ALCF_WS_TUT3_FLOW_DESC_0: >-
    The Chef's voice trails off as they pull seemingly random food items from
    crates scattered throughout the market stall.

    You try to make note of the recipe but Cronus never measures a single
    ingredient as they weave from one <TECHNOLOGY>Nutrient Processor<> to the
    next.

    Finally, placed before you is a gently-baked <SPECIAL>meringue<>, a bowl of
    <SPECIAL>custard<>, and small dish of <SPECIAL>jam<> that changes color
    whenever you look away.
  D_ALCF_WS_TUT3_FLOW_DESC_2: >-
    As Cronus sculpts the <SPECIAL>offering's<> final form, a hum begins to
    resonates from the dessert before you.

    The hum becomes a voice, then the voice becomes a chorus. Barely audible but
    always present.

    You wonder if you have you heard this song before.
  D_ALCF_WS_TUT3_FLOW_LANG_1: >-
    The <TECHNOLOGY>Nutrient Processors<> would get this last part wrong. Each
    <SPECIAL>offering<> is different...

    It wants to sing, and you must help it find it's voice.
  D_ALCF_WS_TUT3_FLOW_LANG_3: >-
    There you go, my friend! I can modestly say that it is one of my finest
    desserts yet.

    Now, if you would be so kind, it would like to <SPECIAL>harmonize<> with the
    stars.
  D_ALCF_WS_TUT3_OPT_A: Prepare offering for transport
  D_CHEF_SONG_OPT_A: Give
  D_CHEFHI_HI_LANG: Traveler. Have we met before?
  D_CHEFHI_HI_RES_B: >-
    Hmm... Nada and Polo sometimes change things. Granted, it's usually for the
    better.

    And recently, an alchemist has been bringing in shipments of <FLORA>NipNip
    Buds<>.

    What a fascinating plant... Does wonders for my mood, terrible on my memory.

    Oh, right! Greetings and salutations Traveler!
  D_CHEFHI_INTRO_LANG: >-
    I am the iteration known as Cronus. Trader in rare cuisine, professional
    food critic, and amateur whalesong tracker.
  D_CHEFHI_INTRO_OPT_A: About rare cuisine...
  D_CHEFHI_INTRO_OPT_B: About food critiques...
  D_CHEFHI_INTRO_OPT_C: About whalesong...
  D_CHEFHI_INTRO_OPT_D: Continue
  D_CHEFHI_INTRO_RES_A: >-
    Whether it is <FLORA>The Stellarator<> or <FLORA>The Spawning Tart<>, I'm
    always looking to expand my portfolio.

    What I am looking to acquire changes from day to day, so be sure to stop by
    if you haven't been in the Nexus recently.

    I also coordinate the Ingredients Market for settlements in the region, if
    you have a moment to spare.

    Fair compensation and competitive prices for all your certified organic
    ingredient needs.
  D_CHEFHI_INTRO_RES_B: >-
    That is dangerous territory my friend! Many have brought their "finest"
    works before me, and most have not dared to again.

    Should you prepare something interesting I will offer you the same services,
    but know that the cost is my honest opinion.
  D_CHEFHI_INTRO_RES_C: >-
    The galaxy outside this Nexus has recently experienced a migration of the
    most fascinating megafauna.

    Space-faring and warp capable! Furthermore, if the rumors are believed to be
    true, also highly intelligent.

    What do they eat? Do they prefer <FLORA>Fungal Omelette<> or
    <FLORA>Chocolate Curiosity<>? Or perhaps <FLORA>Cake of Burning Dread<>!

    Pah. Enough speculation. Let us work together on other matters, then we can
    discuss this topic further.
  D_CHEFHI_INTRO_RES_D: >-
    Before you go, take a <TECHNOLOGY>Nutrient Processor<> and construction
    plans. Consider it an investment.

    The galaxy out there isn't all hazardous rainstorms and murderous robots.

    There is also good food to be had, especially if you know how to prepare it
    properly!
  D_CHEFHI_SYNC1_LANG: >-
    See, I thought so! You were going to bring me Diplo Eggs, or was it Custard
    Doughnuts?

    Or, perhaps it was something else entirely...

    Did I make for you an <SPECIAL>Offering of a Forgetten Song<>, a legendary
    dessert that can be used to communicate with migratory cosmic megafauna?
  D_CHEFHI_SYNC1_RES_B: Then perhaps we have not met before. Let us reconsider for a moment...
  D_CHEFHI_SYNC2_LANG: >-
    And did I teach you the recipe for an <SPECIAL>Offering of a Forgotten
    Song<>?
  D_CHEFHI_SYNC2_RES_A: >-
    Well, in that case I thank you for your patronage! Give me just a moment to
    set up shop for today and we can continue our culinary journey.
  D_CHEFHI_SYNC2_RES_B: >-
    Something to look forward to, then! Give me just a moment to set up shop for
    today and we can continue our culinary journey.
  D_CHEFOF_HOME_FLOW_DESC_1: >-
    Cronus tilts their head inquisitively, then a smile forms across their broad
    face.

    In this moment of recognition, their mood shifts to one of unreserved glee.
  D_CHEFOF_HOME_FLOW_LANG_0: My friend! You walk as if you are in a daze. Is everything alright?
  D_CHEFOF_HOME_FLOW_LANG_2: >-
    The Sea of Stars will grant it's secrets to those who witness the harmony of
    songs.

    But knowledge hoarded is knowledge lost. You must share your story.

    Quickly now, before the dream fades away.
  D_CHEFOF_HOME_OPT_A: Share your story...
  D_CHEFOF_PART_A_FLOW_DESC_0: >-
    I tell Cronus of the moment I opened up my mind to the <SPECIAL>Offering of
    a Forgotten Song<>.

    I explain the guidance of the <SPECIAL>Song<> as I adjusted my ship's
    trajectory to an unknown point in space.
  D_CHEFOF_PART_A_FLOW_DESC_1: >-
    And I speak of the choir, not just from the offering, but from my entire
    ship as I engaged the <TECHNOLOGY>Pulse Drive<> to our destination.
  D_CHEFOF_PART_A_OPT_A: Continue...
  D_CHEFOF_PART_B_FLOW_DESC_0: >-
    I describe the majestic creature bathed in stardust that came to answer the
    call of harmony.

    As I describe the experience, each moment of the dream returns to me.
  D_CHEFOF_PART_B_FLOW_DESC_1: >-
    In this moment, I can still hear the <VISOR>WHALESONG HARMONY<>.

    What was once a hazy dream manifests as tangible memories, my mind commiting
