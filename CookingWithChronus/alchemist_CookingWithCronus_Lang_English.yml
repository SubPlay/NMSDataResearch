  ALCH_CHEF_OFFER_CRON_OBJ_WAIT_B: <TITLE>Return to<> <HIGHLIGHT>Iteration Cronus<> <TITLE>aboard the Nexus<>
  ALCH_CHEF_OFFER_DESC_1: >-
    <HIGHLIGHT>Iteration Cronus<> has prepared an <SPECIAL>Offering of a
    Forgotten Song<>,  a dessert that can capture the attention of nearby
    <RARE>cosmic megafauna<>. 


    NOTE: Should the offering be lost before completing the encounter, a
    replacement can be obtained from <HIGHLIGHT>Cronus<>.
  ALCH_CHEF_OFFER_LBL_CRON: Share your story with Cronus
  ALCH_CHEF_OFFER_SONG_OBJ: Activate the Offering of a Forgotten Song
  ALCH_CHEF_OFFER_SONG_OBJ_TIP: >-
    Locate the <RARE>Offering of a Forgotten Song<> in your Inventory 
    (<IMG>INVENTORY<>) then use Harmonize (<IMG>FE_ALT1<>) while in 
    <SPECIAL>deep space<> to broadcast an invitation for a harmonic partner.
  ALCH_CHEF_OFFER_SONG_OBJ_WAIT: >-
    Locate the <RARE>Offering of a Forgotten Song<> in your Inventory
    (<IMG>INVENTORY<>).

    Use Harmonize (<IMG>FE_ALT1<>) to search for a harmonic partner...
