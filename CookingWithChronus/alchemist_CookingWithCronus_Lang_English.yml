  ALCH_CHEF_OFFER_TITLE_1: Forgotten Songs
  ALCH_CHEF_OFFER_WHALE_OBJ: Follow the offering's guidance
  ALCH_CHEF_OFFER_WHALE_OBJ_TIP: >-
    The <SPECIAL>Offering of a Forgotten Song<> is seeking a harmonic partner.
    Follow it's guidance to unlock it's secrets.
